[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os"
version = "0.1.0"
description = "AI Software Engineering Orchestrator & Build System"
authors = [{ name = "AI-OS Team" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tree-sitter>=0.24,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-html>=0.23,<0.24",
    "tree-sitter-css>=0.25,<0.26",
    "tree-sitter-sql>=0.3.11,<0.4",
    "networkx>=3.4,<4",
    "click>=8.1,<9",
    "rich>=13,<16",
    "pydantic>=2.6,<3",
    "sqlalchemy>=2.0.28,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<1"]

[project.scripts]
ai-os = "ai_os.cli:main"

[tool.setuptools.packages.find]
include = ["ai_os*"]

[tool.setuptools.package-data]
"ai_os.analyzer" = ["queries/*.scm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
